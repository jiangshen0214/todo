<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>日历待办</title>
<style>
  :root {
    --orange: #C74B2E;
    --orange-dark: #A93A20;
    --orange-soft: #F7E8DE;
    --orange-border: #ECCBB8;
    --bg: #F4EFE6;
    --card: #FCFAF4;
    --ink: #2B2B2B;
    --ink-soft: #5C5C5C;
    --ink-faint: #A29A8B;
    --line: #E8E1D3;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(43, 38, 28, .05), 0 1px 3px rgba(43, 38, 28, .08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    background-image:
      radial-gradient(1100px 560px at 82% -8%, rgba(199, 75, 46, .06), transparent 62%),
      radial-gradient(900px 520px at 8% 108%, rgba(43, 43, 43, .06), transparent 62%);
    -webkit-font-smoothing: antialiased;
  }

  button { font-family: inherit; }

  /* ===== 水墨背景层 ===== */
  .ink-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .ink-bg svg { width: 100%; height: 100%; display: block; }

  .app { position: relative; z-index: 1; }

  /* ===== 竖排题字（三十年河东……） ===== */
  .quote-wrap {
    position: fixed;
    right: 40px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    pointer-events: none;
  }
  .quote {
    writing-mode: vertical-rl;
    font-family: "STKaiti", "KaiTi", "楷体", "华文行楷", "STXingkai", serif;
    font-size: 30px;
    letter-spacing: 9px;
    color: #3a3428;
    opacity: .55;
    text-shadow: 0 1px 0 rgba(255, 255, 255, .6);
  }
  .quote span { display: block; }
  .seal {
    width: 46px; height: 46px;
    background: var(--orange);
    color: #fdf6ee;
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 28px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .22), 0 2px 6px rgba(0, 0, 0, .16);
    opacity: .92;
  }
  @media (max-width: 1100px) {
    .quote-wrap { display: none; }
  }

  /* ===== 整体布局 ===== */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: rgba(252, 250, 244, .82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-right: 1px solid var(--line);
    padding: 24px 16px;
    overflow: hidden;
    transition: width .22s ease, padding .22s ease;
  }
  .app.collapsed .sidebar { width: 0; padding-left: 0; padding-right: 0; border-right: none; }

  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; white-space: nowrap; }
  .brand-logo {
    width: 40px; height: 40px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    color: #fff;
    background: var(--orange);
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(242, 140, 56, .28);
  }
  .brand-name { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .brand-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

  .nav { flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 15px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .15s, color .15s;
    user-select: none;
    white-space: nowrap;
  }
  .nav-item:hover { background: #F3EEE3; color: var(--ink); }
  .nav-item.active { background: var(--orange-soft); color: var(--orange-dark); font-weight: 600; }
  .nav-icon { font-size: 18px; line-height: 1; }

  .sidebar-foot { padding: 12px 8px 0; border-top: 1px solid var(--line); white-space: nowrap; }
  .foot-note { font-size: 12px; color: var(--ink-faint); }

  /* ===== 主内容区 ===== */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* 顶部栏 */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    background: rgba(252, 250, 244, .82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; }
  .icon-btn {
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-size: 18px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .icon-btn:hover { background: #F3EEE3; color: var(--ink); }

  .month-display { font-size: 17px; font-weight: 700; letter-spacing: .5px; }

  .search-wrap { display: flex; align-items: center; gap: 6px; }
  .search-input {
    display: none;
    width: 180px;
    font-family: inherit;
    font-size: 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    outline: none;
    transition: border-color .15s;
  }
  .search-input:focus { border-color: var(--orange); }
  .search-wrap.open .search-input { display: block; }

  /* 内容 */
  .content {
    flex: 1;
    width: 100%;
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 20px 120px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* ===== 日历 ===== */
  .calendar-card { padding: 16px 16px 12px; }

  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .cal-title { font-size: 18px; font-weight: 700; letter-spacing: 1px; }
  .cal-nav { display: flex; gap: 4px; }
  .cal-nav button {
    width: 32px; height: 32px;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-size: 18px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .cal-nav button:hover { background: #F3EEE3; color: var(--ink); }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    text-align: center;
    font-size: 13px;
    color: var(--ink-faint);
    padding: 4px 0 8px;
  }
  .weekdays .sun, .cell.sat .day-num { color: var(--orange-dark); }

  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

  .cell {
    position: relative;
    min-height: 66px;
    border-radius: 12px;
    padding: 6px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: background .15s;
  }
  .cell:hover { background: #F5F0E6; }
  .cell.muted { opacity: .35; }
  .cell.muted:hover { background: transparent; }
  .cell.selected { background: var(--orange-soft); }

  .day-num {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    font-weight: 600;
    border-radius: 50%;
  }
  .cell.today .day-num { background: var(--orange); color: #fff; }
  .cell.muted .day-num { color: inherit; }

  .day-lunar { font-size: 10px; color: var(--ink-faint); margin-top: 1px; line-height: 1.2; }
  .day-mark {
    font-size: 10px;
    font-weight: 600;
    color: var(--orange-dark);
    margin-top: 1px;
    line-height: 1.2;
    white-space: nowrap;
  }

  /* ===== 当日任务 ===== */
  .day-card { margin-top: 18px; overflow: hidden; }

  .day-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px 4px;
  }
  .day-date-title { font-size: 16px; font-weight: 700; }
  .day-date-title .badge {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: var(--orange);
    border-radius: 8px;
    padding: 2px 9px;
    margin-left: 8px;
    vertical-align: 2px;
  }
  .day-count { font-size: 13px; color: var(--ink-faint); }

  .task-list { list-style: none; }

  .task {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 20px;
    border-top: 1px solid var(--line);
  }
  .task .check {
    flex: 0 0 auto;
    width: 22px; height: 22px;
    margin-top: 1px;
    border: 2px solid #D6D9DD;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: transparent;
    transition: all .18s;
  }
  .task .check:hover { border-color: var(--orange); }
  .task.done .check { background: var(--orange); border-color: var(--orange); color: #fff; }

  .task-main { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; line-height: 1.5; word-break: break-word; }
  .task.done .task-title { color: var(--ink-faint); text-decoration: line-through; }
  .task-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
  .task-memo { font-size: 13px; color: var(--ink-soft); margin-top: 4px; word-break: break-word; }
  .chip {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 20px;
    letter-spacing: .5px;
  }
  .chip.time { background: #EAF3FE; color: #2F6FBF; }
  .chip.tag { background: var(--orange-soft); color: var(--orange-dark); }

  .sub-list { list-style: none; margin-top: 6px; }
  .sub-list li { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-soft); padding: 1px 0; }
  .sub-list .sub-dot { width: 6px; height: 6px; border-radius: 50%; background: #D6D9DD; flex-shrink: 0; }
  .sub-list li.done { color: var(--ink-faint); text-decoration: line-through; }
  .sub-list li.done .sub-dot { background: var(--orange); }

  .task .del {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    font-size: 16px;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 50%;
    opacity: 0;
    transition: opacity .15s, background .15s, color .15s;
  }
  .task:hover .del { opacity: 1; }
  .task .del:hover { background: #FDECEC; color: #E5484D; }

  /* 空状态 */
  .empty-state { text-align: center; padding: 44px 20px 50px; }
  .empty-illus {
    width: 92px; height: 92px;
    margin: 0 auto 16px;
    display: flex; align-items: center; justify-content: center;
    background: var(--orange-soft);
    border-radius: 50%;
    font-size: 44px;
  }
  .empty-text { font-size: 15px; color: var(--ink-soft); }
  .empty-sub { font-size: 13px; color: var(--ink-faint); margin-top: 6px; }

  /* ===== 悬浮加号 ===== */
  .fab {
    position: fixed;
    right: 28px;
    bottom: 28px;
    width: 58px; height: 58px;
    border: none;
    border-radius: 50%;
    background: var(--orange);
    color: #fff;
    font-size: 30px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(242, 140, 56, .4);
    transition: background .15s, transform .15s;
    z-index: 20;
  }
  .fab:hover { background: var(--orange-dark); }
  .fab:active { transform: scale(.94); }

  /* ===== 弹窗 ===== */
  .modal-mask {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(17, 24, 39, .42);
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease;
  }
  .modal-mask.open { opacity: 1; pointer-events: auto; }

  .modal {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 24px 60px rgba(16, 24, 40, .28);
    transform: translateY(16px) scale(.98);
    transition: transform .2s ease;
    overflow: hidden;
  }
  .modal-mask.open .modal { transform: translateY(0) scale(1); }

  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 6px;
  }
  .modal-title { font-size: 17px; font-weight: 700; }
  .modal-close {
    width: 30px; height: 30px;
    border: none;
    background: transparent;
    font-size: 16px;
    color: var(--ink-faint);
    border-radius: 50%;
    cursor: pointer;
  }
  .modal-close:hover { background: #F3EEE3; color: var(--ink); }

  .modal-body { padding: 6px 20px 4px; }

  .task-title-input {
    width: 100%;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    border: none;
    border-bottom: 1.5px solid var(--line);
    padding: 8px 2px 10px;
    outline: none;
  }
  .task-title-input::placeholder { color: var(--ink-faint); font-weight: 400; }
  .task-title-input:focus { border-color: var(--orange); }

  .task-memo-input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    border: none;
    resize: none;
    padding: 10px 2px 6px;
    outline: none;
  }
  .task-memo-input::placeholder { color: var(--ink-faint); }

  .toolbar { display: flex; gap: 8px; margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .tool {
    display: flex; align-items: center; gap: 5px;
    font-size: 13px;
    color: var(--ink-soft);
    background: transparent;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 7px 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .tool:hover { border-color: var(--orange-border); color: var(--ink); }
  .tool.active { background: var(--orange-soft); border-color: var(--orange-border); color: var(--orange-dark); }

  .tool-panel { display: none; padding: 10px 0 4px; }
  .tool-panel.open { display: block; }

  .tool-panel input[type="time"] {
    font-family: inherit;
    font-size: 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    outline: none;
  }
  .tool-panel input[type="time"]:focus { border-color: var(--orange); }

  .tag-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tag-chip {
    font-size: 13px;
    color: var(--ink-soft);
    background: #F3EEE3;
    border: 1.5px solid transparent;
    border-radius: 20px;
    padding: 5px 14px;
    cursor: pointer;
    transition: all .15s;
  }
  .tag-chip.active { background: var(--orange-soft); border-color: var(--orange-border); color: var(--orange-dark); font-weight: 600; }

  .tool-panel input[type="text"] {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    outline: none;
  }
  .tool-panel input[type="text"]:focus { border-color: var(--orange); }

  .checklist-items { list-style: none; margin-bottom: 8px; }
  .checklist-items li {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px;
    padding: 5px 0;
  }
  .checklist-items .sub-check {
    width: 17px; height: 17px;
    border: 1.5px solid #D6D9DD;
    border-radius: 5px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: transparent;
    flex-shrink: 0;
  }
  .checklist-items li.done .sub-check { background: var(--orange); border-color: var(--orange); color: #fff; }
  .checklist-items li.done .sub-text { color: var(--ink-faint); text-decoration: line-through; }
  .checklist-items .sub-text { flex: 1; word-break: break-word; }
  .checklist-items .sub-del { border: none; background: transparent; color: var(--ink-faint); cursor: pointer; font-size: 14px; }

  .checklist-add { display: flex; gap: 6px; }
  .checklist-add input { flex: 1; }
  .checklist-add button {
    border: none;
    background: var(--orange-soft);
    color: var(--orange-dark);
    width: 38px;
    border-radius: 10px;
    font-size: 18px;
    cursor: pointer;
  }

  .modal-actions {
    display: flex; gap: 10px;
    padding: 16px 20px 20px;
  }
  .modal-actions button {
    flex: 1;
    font-size: 15px;
    font-weight: 600;
    border: none;
    border-radius: 12px;
    padding: 12px 0;
    cursor: pointer;
    transition: background .15s;
  }
  .btn-cancel { background: #F3EEE3; color: var(--ink-soft); }
  .btn-cancel:hover { background: #E9E2D4; }
  .btn-save { background: var(--orange); color: #fff; }
  .btn-save:hover { background: var(--orange-dark); }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto;
      position: static;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .app.collapsed .sidebar { width: 100%; height: 0; padding-top: 0; padding-bottom: 0; border-bottom: none; }
    .brand { padding: 0; }
    .brand-logo { width: 34px; height: 34px; font-size: 16px; border-radius: 10px; }
    .brand-sub { display: none; }
    .nav { flex: 1; display: flex; }
    .nav-item { padding: 8px 12px; }
    .sidebar-foot { display: none; }
    .content { padding: 18px 12px 120px; }
    .topbar { padding: 10px 14px; }
    .cell { min-height: 56px; }
    .fab { right: 20px; bottom: 20px; width: 54px; height: 54px; }
  }
</style>
</head>
<body>
  <!-- 水墨背景：远山 + 墨晕 -->
  <div class="ink-bg" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="inkBlot" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#3a3428" stop-opacity="0.12"/>
          <stop offset="68%" stop-color="#3a3428" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="#3a3428" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="1180" cy="210" r="320" fill="url(#inkBlot)"/>
      <circle cx="170" cy="640" r="380" fill="url(#inkBlot)"/>
      <path d="M0 640 L150 560 L300 620 L430 540 L580 610 L700 560 L850 630 L980 545 L1120 615 L1260 555 L1440 605 L1440 900 L0 900 Z" fill="#e7e1d3"/>
      <path d="M0 700 L140 640 L290 705 L440 610 L600 690 L760 635 L900 705 L1050 620 L1210 690 L1360 640 L1440 690 L1440 900 L0 900 Z" fill="#d7cfbd" opacity="0.85"/>
      <path d="M0 770 L180 700 L360 760 L540 685 L720 755 L900 695 L1080 760 L1260 705 L1440 755 L1440 900 L0 900 Z" fill="#c2b9a5" opacity="0.7"/>
      <path d="M0 835 L220 780 L430 830 L650 775 L860 825 L1080 780 L1300 830 L1440 795 L1440 900 L0 900 Z" fill="#a99f8b" opacity="0.55"/>
    </svg>
  </div>

  <!-- 竖排题字 -->
  <div class="quote-wrap" aria-hidden="true">
    <div class="quote">
      <span>三十年河东，</span>
      <span>三十年河西，</span>
      <span>莫欺少年穷！</span>
    </div>
    <div class="seal">炎</div>
  </div>

  <div class="app" id="app">
    <!-- 左侧侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">☑</div>
        <div>
          <div class="brand-name">待办清单</div>
          <div class="brand-sub">记录 · 慢慢完成</div>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-item active">
          <span class="nav-icon">📅</span>
          <span>日历</span>
        </div>
      </nav>

      <div class="sidebar-foot">
        <div class="foot-note">今天也要元气满满 ✨</div>
      </div>
    </aside>

    <!-- 右侧主内容区 -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="toggleSidebar" title="收起/展开侧边栏">☰</button>
          <span class="month-display" id="monthDisplay">2026.10</span>
        </div>
        <div class="search-wrap" id="searchWrap">
          <input class="search-input" id="searchInput" type="text" placeholder="搜索任务…" />
          <button class="icon-btn" id="searchBtn" title="搜索">🔍</button>
        </div>
      </header>

      <div class="content">
        <!-- 日历 -->
        <section class="card calendar-card">
          <div class="cal-head">
            <div class="cal-title" id="calTitle">2026年10月</div>
            <div class="cal-nav">
              <button id="prevMonth" title="上一月">‹</button>
              <button id="todayBtn" title="回到今天">今</button>
              <button id="nextMonth" title="下一月">›</button>
            </div>
          </div>
          <div class="weekdays">
            <span class="sun">日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
          </div>
          <div class="grid" id="grid"></div>
        </section>

        <!-- 当日任务 -->
        <section class="card day-card">
          <div class="day-head">
            <div class="day-date-title" id="dayDateTitle">10月18日 · 星期六</div>
            <span class="day-count" id="dayCount"></span>
          </div>
          <div id="dayBody"></div>
        </section>
      </div>

      <!-- 悬浮加号 -->
      <button class="fab" id="fab" title="新建任务">＋</button>
    </main>
  </div>

  <!-- 新建任务弹窗 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title" id="modalTitle">新建任务</span>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="modal-body">
        <input class="task-title-input" id="taskTitle" type="text" maxlength="80" placeholder="准备做点什么？" />
        <textarea class="task-memo-input" id="taskMemo" placeholder="备注…" rows="2"></textarea>

        <div class="toolbar">
          <button class="tool" data-tool="time">🕐 <span>时间</span></button>
          <button class="tool" data-tool="tag">🏷️ <span>标签</span></button>
          <button class="tool" data-tool="checklist">✅ <span>清单</span></button>
        </div>

        <div class="tool-panel" id="panel-time">
          <input type="time" id="taskTime" />
        </div>
        <div class="tool-panel" id="panel-tag">
          <div class="tag-chips" id="tagChips">
            <button class="tag-chip" data-tag="工作">工作</button>
            <button class="tag-chip" data-tag="学习">学习</button>
            <button class="tag-chip" data-tag="生活">生活</button>
            <button class="tag-chip" data-tag="其他">其他</button>
          </div>
          <input type="text" id="taskTag" placeholder="自定义标签…" maxlength="20" />
        </div>
        <div class="tool-panel" id="panel-checklist">
          <ul class="checklist-items" id="checklistItems"></ul>
          <div class="checklist-add">
            <input type="text" id="checklistInput" placeholder="添加子任务…" maxlength="60" />
            <button id="checklistAdd">＋</button>
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="modalCancel">取消</button>
        <button class="btn-save" id="modalSave">保存</button>
      </div>
    </div>
  </div>

<script>
(function () {
  /* ===================== 农历数据 ===================== */
  var lunarInfo = [0x4bd8, 0x4ae0, 0xa570, 0x54d5, 0xd260, 0xd950, 0x16554, 0x56a0, 0x9ad0, 0x55d2, 0x4ae0, 0xa5b6, 0xa4d0, 0xd250, 0x1d255, 0xb540, 0xd6a0, 0xada2, 0x95b0, 0x14977, 0x4970, 0xa4b0, 0xb4b5, 0x6a50, 0x6d40, 0x1ab54, 0x2b60, 0x9570, 0x52f2, 0x4970, 0x6566, 0xd4a0, 0xea50, 0x16a95, 0x5ad0, 0x2b60, 0x186e3, 0x92e0, 0x1c8d7, 0xc950, 0xd4a0, 0x1d8a6, 0xb550, 0x56a0, 0x1a5b4, 0x25d0, 0x92d0, 0xd2b2, 0xa950, 0xb557, 0x6ca0, 0xb550, 0x15355, 0x4da0, 0xa5b0, 0x14573, 0x52b0, 0xa9a8, 0xe950, 0x6aa0, 0xaea6, 0xab50, 0x4b60, 0xaae4, 0xa570, 0x5260, 0xf263, 0xd950, 0x5b57, 0x56a0, 0x96d0, 0x4dd5, 0x4ad0, 0xa4d0, 0xd4d4, 0xd250, 0xd558, 0xb540, 0xb6a0, 0x195a6, 0x95b0, 0x49b0, 0xa974, 0xa4b0, 0xb27a, 0x6a50, 0x6d40, 0xaf46, 0xab60, 0x9570, 0x4af5, 0x4970, 0x64b0, 0x74a3, 0xea50, 0x6b58, 0x5ac0, 0xab60, 0x96d5, 0x92e0, 0xc960, 0xd954, 0xd4a0, 0xda50, 0x7552, 0x56a0, 0xabb7, 0x25d0, 0x92d0, 0xcab5, 0xa950, 0xb4a0, 0xbaa4, 0xad50, 0x55d9, 0x4ba0, 0xa5b0, 0x15176, 0x52b0, 0xa930, 0x7954, 0x6aa0, 0xad50, 0x5b52, 0x4b60, 0xa6e6, 0xa4e0, 0xd260, 0xea65, 0xd530, 0x5aa0, 0x76a3, 0x96d0, 0x4afb, 0x4ad0, 0xa4d0, 0x1d0b6, 0xd250, 0xd520, 0xdd45, 0xb5a0, 0x56d0, 0x55b2, 0x49b0, 0xa577, 0xa4b0, 0xaa50, 0x1b255, 0x6d20, 0xada0, 0x14b63, 0x9370, 0x49f8, 0x4970, 0x64b0, 0x168a6, 0xea50, 0x6aa0, 0x1a6c4, 0xaae0, 0x92e0, 0xd2e3, 0xc960, 0xd557, 0xd4a0, 0xda50, 0x5d55, 0x56a0, 0xa6d0, 0x55d4, 0x52d0, 0xa9b8, 0xa950, 0xb4a0, 0xb6a6, 0xad50, 0x55a0, 0xaba4, 0xa5b0, 0x52b0, 0xb273, 0x6930, 0x7337, 0x6aa0, 0xad50, 0x14b55, 0x4b60, 0xa570, 0x54e4, 0xd160, 0xe968, 0xd520, 0xdaa0, 0x16aa6, 0x56d0, 0x4ae0, 0xa9d4, 0xa2d0, 0xd150, 0xf252, 0xd520];

  var CN_MONTH = ['正月', '二月', '三月', '四月', '五月', '六月', '七月', '八月', '九月', '十月', '冬月', '腊月'];
  var CN_DAY = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十',
    '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十',
    '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];

  function leapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
  function leapDays(y) { return leapMonth(y) ? ((lunarInfo[y - 1900] & 0x10000) ? 30 : 29) : 0; }
  function monthDays(y, m) { return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
  function yearDays(y) {
    var s = 348, i;
    for (i = 0x8000; i > 0x8; i >>= 1) s += (lunarInfo[y - 1900] & i) ? 1 : 0;
    return s + leapDays(y);
  }

  function solar2lunar(y, m, d) {
    var offset = (Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000;
    var i, temp = 0;
    for (i = 1900; i < 2101 && offset > 0; i++) { temp = yearDays(i); offset -= temp; }
    if (offset < 0) { offset += temp; i--; }
    var lunarYear = i;
    var lm = leapMonth(lunarYear);
    var isLeap = false, month = 0, day = 0;
    for (i = 1; i < 13 && offset > 0; i++) {
      if (lm > 0 && i === (lm + 1) && isLeap === false) {
        --i; isLeap = true; temp = leapDays(lunarYear);
      } else {
        temp = monthDays(lunarYear, i);
      }
      if (isLeap === true && i === (lm + 1)) isLeap = false;
      offset -= temp;
    }
    if (offset === 0 && lm > 0 && i === lm + 1) {
      if (isLeap) { isLeap = false; } else { isLeap = true; --i; }
    }
    if (offset < 0) { offset += temp; --i; }
    month = i; day = offset + 1;
    return { year: lunarYear, month: month, day: day, isLeap: isLeap };
  }

  function lunarDayText(y, m, d) {
    var r = solar2lunar(y, m, d);
    return r.day === 1 ? CN_MONTH[r.month - 1] : CN_DAY[r.day - 1];
  }

  /* 节气（典型日期） */
  var SOLAR_TERMS = [
    [1, 5, '小寒'], [1, 20, '大寒'], [2, 4, '立春'], [2, 19, '雨水'],
    [3, 5, '惊蛰'], [3, 20, '春分'], [4, 4, '清明'], [4, 20, '谷雨'],
    [5, 5, '立夏'], [5, 21, '小满'], [6, 5, '芒种'], [6, 21, '夏至'],
    [7, 7, '小暑'], [7, 23, '大暑'], [8, 7, '立秋'], [8, 23, '处暑'],
    [9, 7, '白露'], [9, 23, '秋分'], [10, 8, '寒露'], [10, 23, '霜降'],
    [11, 7, '立冬'], [11, 22, '小雪'], [12, 7, '大雪'], [12, 21, '冬至']
  ];
  var TERM_MAP = {};
  SOLAR_TERMS.forEach(function (t) { TERM_MAP[t[0] + '-' + t[1]] = t[2]; });

  /* 节假日 */
  var GREGORIAN_HOLIDAYS = { '1-1': '元旦', '5-1': '劳动节', '6-1': '儿童节', '10-1': '国庆节' };
  var LUNAR_HOLIDAYS = { '1-1': '春节', '1-15': '元宵节', '5-5': '端午节', '7-7': '七夕', '8-15': '中秋节', '9-9': '重阳节' };

  function dayMark(y, m, d) {
    var r = solar2lunar(y, m, d);
    var lunarKey = r.month + '-' + r.day;
    if (!r.isLeap && LUNAR_HOLIDAYS[lunarKey]) return LUNAR_HOLIDAYS[lunarKey];
    var g = GREGORIAN_HOLIDAYS[m + '-' + d];
    if (g) return g;
    var t = TERM_MAP[m + '-' + d];
    if (t) return t;
    return '';
  }

  /* ===================== 应用状态 ===================== */
  var STORAGE_KEY = 'calendar-tasks-v1';
  var $ = function (id) { return document.getElementById(id); };

  var now = new Date();
  var viewYear = now.getFullYear();
  var viewMonth = now.getMonth() + 1; // 1-12
  var selDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  var tasks = load();
  var searchQuery = '';
  var selectedTag = '';

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }
  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }

  function dateKey(d) {
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }

  /* ===================== 日历渲染 ===================== */
  var grid = $('grid');
  var calTitle = $('calTitle');
  var monthDisplay = $('monthDisplay');

  function pad2(n) { return (n < 10 ? '0' : '') + n; }

  function renderCalendar() {
    calTitle.textContent = viewYear + '年' + viewMonth + '月';
    monthDisplay.textContent = viewYear + '.' + pad2(viewMonth);

    var first = new Date(viewYear, viewMonth - 1, 1);
    var daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
    var startWeekday = first.getDay(); // 0=周日

    var today = new Date();
    var todayKey = dateKey(today);
    var selKey = dateKey(selDate);

    grid.innerHTML = '';

    // 上个月补位
    var prevDays = new Date(viewYear, viewMonth - 1, 0).getDate();
    var i;
    for (i = startWeekday - 1; i >= 0; i--) {
      var pd = prevDays - i;
      grid.appendChild(buildCell(viewYear, viewMonth - 1, pd, true));
    }

    // 本月
    for (var d = 1; d <= daysInMonth; d++) {
      grid.appendChild(buildCell(viewYear, viewMonth, d, false));
    }

    // 下个月补位（凑满 42 格）
    var rendered = startWeekday + daysInMonth;
    var remaining = (rendered % 7 === 0) ? 0 : 7 - (rendered % 7);
    var fill = 42 - rendered;
    if (fill < 0) fill = 0;
    if (fill === 0 && remaining > 0) fill = remaining;
    for (i = 1; i <= fill; i++) {
      grid.appendChild(buildCell(viewYear, viewMonth + 1, i, true));
    }
  }

  function buildCell(y, m, d, muted) {
    var cell = document.createElement('div');
    cell.className = 'cell' + (muted ? ' muted' : '');

    var date = new Date(y, m - 1, d);
    var key = dateKey(date);
    var today = new Date();
    var isToday = date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth() && date.getDate() === today.getDate();

    if (isToday) cell.classList.add('today');
    if (key === dateKey(selDate) && !muted) cell.classList.add('selected');
    if (date.getDay() === 6 && !muted) cell.classList.add('sat');

    var num = document.createElement('div');
    num.className = 'day-num';
    num.textContent = d;

    var lunar = document.createElement('div');
    lunar.className = 'day-lunar';
    lunar.textContent = lunarDayText(date.getFullYear(), date.getMonth() + 1, date.getDate());

    cell.appendChild(num);
    cell.appendChild(lunar);

    var mark = dayMark(date.getFullYear(), date.getMonth() + 1, date.getDate());
    if (mark) {
      var mk = document.createElement('div');
      mk.className = 'day-mark';
      mk.textContent = mark;
      cell.appendChild(mk);
    }

    cell.addEventListener('click', function () {
      if (muted) {
        viewYear = date.getFullYear();
        viewMonth = date.getMonth() + 1;
        renderCalendar();
      }
      selDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      renderCalendar();
      renderDay();
    });

    return cell;
  }

  /* ===================== 当日任务渲染 ===================== */
  var dayDateTitle = $('dayDateTitle');
  var dayCount = $('dayCount');
  var dayBody = $('dayBody');

  function renderDay() {
    var WEEK = ['日', '一', '二', '三', '四', '五', '六'];
    var isToday = dateKey(selDate) === dateKey(new Date());
    dayDateTitle.innerHTML = (selDate.getMonth() + 1) + '月' + selDate.getDate() + '日 · 星期' + WEEK[selDate.getDay()] +
      (isToday ? '<span class="badge">今天</span>' : '');

    var list = tasks[dateKey(selDate)] || [];
    var q = searchQuery.trim().toLowerCase();
    if (q) {
      list = list.filter(function (t) {
        return (t.title && t.title.toLowerCase().indexOf(q) !== -1) ||
          (t.memo && t.memo.toLowerCase().indexOf(q) !== -1) ||
          (t.tag && t.tag.toLowerCase().indexOf(q) !== -1);
      });
    }

    dayCount.textContent = list.length ? list.length + ' 项' : '';
    dayBody.innerHTML = '';

    if (list.length === 0) {
      dayBody.innerHTML =
        '<div class="empty-state">' +
        '<div class="empty-illus">🌤️</div>' +
        '<div class="empty-text">' + (q ? '没有找到相关任务' : '今天没有任务哦~') + '</div>' +
        '<div class="empty-sub">' + (q ? '' : '点右下角 ＋ 添加一件要做的事') + '</div>' +
        '</div>';
      return;
    }

    var ul = document.createElement('ul');
    ul.className = 'task-list';
    list.forEach(function (t) { ul.appendChild(buildTask(t)); });
    dayBody.appendChild(ul);
  }

  function buildTask(t) {
    var li = document.createElement('li');
    li.className = 'task' + (t.done ? ' done' : '');

    var check = document.createElement('span');
    check.className = 'check';
    check.textContent = t.done ? '✓' : '';
    check.title = t.done ? '标记为未完成' : '标记为完成';
    check.addEventListener('click', function () {
      t.done = !t.done;
      save();
      renderDay();
      renderCalendar();
    });

    var main = document.createElement('div');
    main.className = 'task-main';

    var title = document.createElement('div');
    title.className = 'task-title';
    title.textContent = t.title;

    var meta = document.createElement('div');
    meta.className = 'task-meta';
    if (t.time) {
      var cTime = document.createElement('span');
      cTime.className = 'chip time';
      cTime.textContent = '🕐 ' + t.time;
      meta.appendChild(cTime);
    }
    if (t.tag) {
      var cTag = document.createElement('span');
      cTag.className = 'chip tag';
      cTag.textContent = t.tag;
      meta.appendChild(cTag);
    }

    main.appendChild(title);
    if (meta.children.length) main.appendChild(meta);

    if (t.memo) {
      var memo = document.createElement('div');
      memo.className = 'task-memo';
      memo.textContent = t.memo;
      main.appendChild(memo);
    }

    if (t.checklist && t.checklist.length) {
      var sub = document.createElement('ul');
      sub.className = 'sub-list';
      t.checklist.forEach(function (it) {
        var s = document.createElement('li');
        if (it.done) s.className = 'done';
        s.innerHTML = '<span class="sub-dot"></span><span>' + it.text + '</span>';
        sub.appendChild(s);
      });
      main.appendChild(sub);
    }

    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除';
    del.addEventListener('click', function () {
      var key = dateKey(selDate);
      tasks[key] = (tasks[key] || []).filter(function (x) { return x.id !== t.id; });
      save();
      renderDay();
      renderCalendar();
    });

    li.append(check, main, del);
    return li;
  }

  /* ===================== 弹窗 ===================== */
  var modalMask = $('modalMask');
  var taskTitle = $('taskTitle');
  var taskMemo = $('taskMemo');
  var taskTime = $('taskTime');
  var taskTag = $('taskTag');
  var checklistInput = $('checklistInput');
  var checklistItems = $('checklistItems');
  var modalTitle = $('modalTitle');
  var tempChecklist = [];
  var activeTool = '';

  function openModal() {
    modalTitle.textContent = '新建任务 · ' + (selDate.getMonth() + 1) + '月' + selDate.getDate() + '日';
    taskTitle.value = '';
    taskMemo.value = '';
    taskTime.value = '';
    taskTag.value = '';
    tempChecklist = [];
    selectedTag = '';
    activeTool = '';
    document.querySelectorAll('.tag-chip').forEach(function (c) { c.classList.remove('active'); });
    document.querySelectorAll('.tool').forEach(function (c) { c.classList.remove('active'); });
    document.querySelectorAll('.tool-panel').forEach(function (c) { c.classList.remove('open'); });
    renderChecklist();
    modalMask.classList.add('open');
    setTimeout(function () { taskTitle.focus(); }, 60);
  }

  function closeModal() { modalMask.classList.remove('open'); }

  function renderChecklist() {
    checklistItems.innerHTML = '';
    tempChecklist.forEach(function (it, idx) {
      var li = document.createElement('li');
      if (it.done) li.className = 'done';
      var box = document.createElement('span');
      box.className = 'sub-check';
      box.textContent = it.done ? '✓' : '';
      box.addEventListener('click', function () { it.done = !it.done; renderChecklist(); });
      var txt = document.createElement('span');
      txt.className = 'sub-text';
      txt.textContent = it.text;
      var d = document.createElement('button');
      d.className = 'sub-del';
      d.textContent = '✕';
      d.addEventListener('click', function () { tempChecklist.splice(idx, 1); renderChecklist(); });
      li.append(box, txt, d);
      checklistItems.appendChild(li);
    });
  }

  function addChecklistItem() {
    var v = checklistInput.value.trim();
    if (!v) return;
    tempChecklist.push({ text: v, done: false });
    checklistInput.value = '';
    renderChecklist();
  }

  function saveTask() {
    var title = taskTitle.value.trim();
    if (!title) { taskTitle.focus(); return; }
    var key = dateKey(selDate);
    tasks[key] = tasks[key] || [];
    tasks[key].unshift({
      id: Date.now() + Math.random().toString(36).slice(2),
      title: title,
      memo: taskMemo.value.trim(),
      time: taskTime.value,
      tag: selectedTag || taskTag.value.trim(),
      checklist: tempChecklist.slice(),
      done: false,
      createdAt: Date.now()
    });
    save();
    closeModal();
    renderDay();
    renderCalendar();
  }

  /* ===================== 事件 ===================== */
  $('toggleSidebar').addEventListener('click', function () { $('app').classList.toggle('collapsed'); });
  $('prevMonth').addEventListener('click', function () {
    viewMonth--; if (viewMonth < 1) { viewMonth = 12; viewYear--; }
    renderCalendar();
  });
  $('nextMonth').addEventListener('click', function () {
    viewMonth++; if (viewMonth > 12) { viewMonth = 1; viewYear++; }
    renderCalendar();
  });
  $('todayBtn').addEventListener('click', function () {
    viewYear = now.getFullYear(); viewMonth = now.getMonth() + 1;
    selDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    renderCalendar(); renderDay();
  });

  $('fab').addEventListener('click', openModal);
  $('modalClose').addEventListener('click', closeModal);
  $('modalCancel').addEventListener('click', closeModal);
  $('modalSave').addEventListener('click', saveTask);
  modalMask.addEventListener('click', function (e) { if (e.target === modalMask) closeModal(); });
  taskTitle.addEventListener('keydown', function (e) { if (e.key === 'Enter') saveTask(); });
  checklistInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') addChecklistItem(); });
  $('checklistAdd').addEventListener('click', addChecklistItem);

  document.querySelectorAll('.tool').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var tool = btn.dataset.tool;
      if (activeTool === tool) {
        activeTool = '';
        btn.classList.remove('active');
        $('panel-' + tool).classList.remove('open');
      } else {
        activeTool = tool;
        document.querySelectorAll('.tool').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.tool-panel').forEach(function (p) { p.classList.remove('open'); });
        btn.classList.add('active');
        $('panel-' + tool).classList.add('open');
      }
    });
  });

  document.querySelectorAll('.tag-chip').forEach(function (chip) {
    chip.addEventListener('click', function () {
      selectedTag = chip.dataset.tag;
      document.querySelectorAll('.tag-chip').forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');
    });
  });

  $('searchBtn').addEventListener('click', function () {
    var wrap = $('searchWrap');
    wrap.classList.toggle('open');
    if (wrap.classList.contains('open')) $('searchInput').focus();
    else { $('searchInput').value = ''; searchQuery = ''; renderDay(); }
  });
  $('searchInput').addEventListener('input', function () {
    searchQuery = this.value;
    renderDay();
  });

  /* ===================== 初始化 ===================== */
  renderCalendar();
  renderDay();
})();
</script>
</body>
</html>
