<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>待办清单 · 今日</title>
<style>
  :root {
    --orange: #F28C38;
    --orange-dark: #E07B25;
    --orange-soft: #FEF0E5;
    --orange-border: #FBE0C8;
    --bg: #F6F7F9;
    --card: #FFFFFF;
    --ink: #1F2937;
    --ink-soft: #6B7280;
    --ink-faint: #9CA3AF;
    --line: #EEF0F3;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 1px 3px rgba(16, 24, 40, .06);
    --shadow-hover: 0 4px 14px rgba(16, 24, 40, .08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 整体布局：左侧固定侧边栏 + 右侧自适应内容 ===== */
  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 240px;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-right: 1px solid var(--line);
    padding: 24px 16px;
  }

  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; }

  .brand-logo {
    width: 40px; height: 40px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    color: #fff;
    background: var(--orange);
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(242, 140, 56, .28);
  }

  .brand-name { font-size: 17px; font-weight: 700; letter-spacing: 1px; }
  .brand-sub { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }

  .nav { flex: 1; }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 15px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: background .15s, color .15s;
    user-select: none;
  }
  .nav-item:hover { background: #F4F5F7; color: var(--ink); }
  .nav-item.active {
    background: var(--orange-soft);
    color: var(--orange-dark);
    font-weight: 600;
  }
  .nav-icon { font-size: 18px; line-height: 1; }

  .sidebar-foot { padding: 12px 8px 0; border-top: 1px solid var(--line); }
  .foot-note { font-size: 12px; color: var(--ink-faint); }

  /* ===== 右侧主内容区 ===== */
  .main { flex: 1; min-width: 0; }

  .content {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 28px 64px;
  }

  .page-head { margin-bottom: 22px; }
  .page-head h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 1px;
  }
  .page-head h1::before {
    content: "";
    display: inline-block;
    width: 8px; height: 22px;
    background: var(--orange);
    border-radius: 4px;
    margin-right: 12px;
    vertical-align: -3px;
  }
  .page-head .date { margin-top: 6px; font-size: 14px; color: var(--ink-soft); padding-left: 20px; }

  /* ===== 卡片通用 ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }

  /* 励志语卡片 */
  .quote-card {
    display: flex; align-items: center; gap: 10px;
    padding: 18px 20px;
    margin-bottom: 18px;
    font-size: 16px;
    color: var(--ink);
    position: relative;
  }
  .quote-mark { font-size: 24px; color: var(--orange); line-height: 1; font-family: Georgia, serif; }
  .quote-text { flex: 1; line-height: 1.6; }
  .quote-btn {
    flex-shrink: 0;
    width: 30px; height: 30px;
    border: none;
    background: var(--orange-soft);
    color: var(--orange-dark);
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    transition: transform .3s, background .15s;
  }
  .quote-btn:hover { background: var(--orange-border); }
  .quote-btn:active { transform: rotate(180deg); }

  /* 添加任务卡片 */
  .add-card { padding: 16px; margin-bottom: 18px; }

  .add-row { display: flex; gap: 10px; align-items: stretch; }

  .add-row input {
    flex: 1;
    min-width: 0;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink);
    background: #FAFBFC;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    outline: none;
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .add-row input::placeholder { color: var(--ink-faint); }
  .add-row input:focus {
    border-color: var(--orange);
    background: #fff;
    box-shadow: 0 0 0 3px var(--orange-soft);
  }

  .add-row select {
    font-family: inherit;
    font-size: 14px;
    color: var(--ink);
    background: #FAFBFC;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    padding: 0 12px;
    cursor: pointer;
    outline: none;
    transition: border-color .15s;
  }
  .add-row select:focus { border-color: var(--orange); }

  .add-btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--orange);
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s, transform .08s, box-shadow .15s;
    box-shadow: 0 4px 10px rgba(242, 140, 56, .25);
  }
  .add-btn:hover { background: var(--orange-dark); }
  .add-btn:active { transform: translateY(1px); box-shadow: 0 2px 6px rgba(242, 140, 56, .25); }

  /* 任务列表卡片 */
  .list-card { padding: 8px 0 0; overflow: hidden; }

  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px 4px;
  }

  .filters { display: flex; gap: 6px; }
  .filter-btn {
    font-family: inherit;
    font-size: 14px;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: 10px;
    padding: 6px 14px;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .filter-btn:hover { background: #F4F5F7; color: var(--ink); }
  .filter-btn.active { background: var(--orange-soft); color: var(--orange-dark); font-weight: 600; }

  .progress-label { font-size: 13px; color: var(--ink-faint); white-space: nowrap; }

  .progress { padding: 0 20px 12px; }
  .progress-bar { height: 8px; background: #F0F1F3; border-radius: 20px; overflow: hidden; }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--orange);
    border-radius: 20px;
    transition: width .4s ease;
  }

  ul { list-style: none; }

  /* 分类分组 */
  .cat-group {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 20px 8px;
  }
  .cat-group-title { font-size: 14px; font-weight: 600; color: var(--ink-soft); letter-spacing: 1px; }
  .cat-group-count {
    font-size: 12px;
    color: var(--ink-faint);
    background: #F3F4F6;
    border-radius: 10px;
    padding: 1px 8px;
  }

  li.todo {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 20px;
    border-top: 1px solid var(--line);
    animation: pop .22s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .check {
    flex: 0 0 auto;
    width: 24px; height: 24px;
    border: 2px solid #D6D9DD;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    color: transparent;
    transition: all .18s;
  }
  .check:hover { border-color: var(--orange); }

  li.todo.done .check {
    background: var(--orange);
    border-color: var(--orange);
    color: #fff;
    animation: stamp .3s ease;
  }
  @keyframes stamp {
    0% { transform: scale(1.5); opacity: .5; }
    60% { transform: scale(.94); }
    100% { transform: scale(1); opacity: 1; }
  }

  .text { flex: 1; min-width: 0; font-size: 15px; word-break: break-word; line-height: 1.5; }
  li.todo.done .text { color: var(--ink-faint); text-decoration: line-through; }

  .tag {
    flex: 0 0 auto;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    letter-spacing: 1px;
  }
  .tag.cat-生活 { background: #FEF0E5; color: #E07B25; }
  .tag.cat-工作 { background: #E8F1FD; color: #2F6FBF; }
  .tag.cat-学习 { background: #E7F6EE; color: #2F9E6E; }
  .tag.cat-心情 { background: #FDEBF0; color: #D65B8A; }
  .tag.cat-其他 { background: #F0EEFB; color: #7A6BD0; }

  .pri {
    flex: 0 0 auto;
    min-width: 24px; height: 24px;
    line-height: 24px;
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    border-radius: 8px;
    padding: 0 7px;
    cursor: pointer;
    user-select: none;
    transition: transform .15s;
  }
  .pri:hover { transform: scale(1.08); }
  .pri.p-high { background: var(--orange); color: #fff; }
  .pri.p-mid  { background: var(--orange-soft); color: var(--orange-dark); }
  .pri.p-low  { background: #F3F4F6; color: var(--ink-faint); }
  li.todo.done .pri { opacity: .55; }

  .del {
    flex: 0 0 auto;
    width: 28px; height: 28px;
    border: none;
    background: transparent;
    font-size: 16px;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 50%;
    opacity: 0;
    transition: opacity .15s, background .15s, color .15s;
  }
  li.todo:hover .del { opacity: 1; }
  .del:hover { background: #FDECEC; color: #E5484D; }

  .empty {
    text-align: center;
    color: var(--ink-faint);
    font-size: 15px;
    padding: 40px 20px;
  }
  .empty .doodle { font-size: 44px; display: block; margin-bottom: 10px; }

  footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px 16px;
    border-top: 1px solid var(--line);
  }
  .clear-btn {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink-faint);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color .15s;
  }
  .clear-btn:hover { color: #E5484D; }

  .stamp-done {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    color: var(--orange-dark);
    background: var(--orange-soft);
    border-radius: 8px;
    padding: 3px 12px;
    letter-spacing: 1px;
  }

  /* ===== 响应式：窄屏时侧边栏变成顶部横栏 ===== */
  @media (max-width: 768px) {
    .app { flex-direction: column; }
    .sidebar {
      width: 100%; height: auto;
      position: static;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-right: none;
      border-bottom: 1px solid var(--line);
    }
    .brand { padding: 0; }
    .brand-logo { width: 34px; height: 34px; font-size: 16px; border-radius: 10px; }
    .brand-sub { display: none; }
    .nav { flex: 1; display: flex; }
    .nav-item { padding: 8px 12px; }
    .sidebar-foot { display: none; }
    .content { padding: 24px 16px 48px; }
    .add-row { flex-wrap: wrap; }
    .add-row input { flex: 1 1 100%; }
    .add-row select { flex: 1; padding: 0 8px; }
    .add-btn { flex: 1; padding: 11px 0; }
  }
</style>
</head>
<body>
  <div class="app">
    <!-- 左侧固定侧边栏 -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">☑</div>
        <div>
          <div class="brand-name">待办清单</div>
          <div class="brand-sub">记录 · 慢慢完成</div>
        </div>
      </div>

      <nav class="nav">
        <div class="nav-item active">
          <span class="nav-icon">📋</span>
          <span>待办清单</span>
        </div>
      </nav>

      <div class="sidebar-foot">
        <div class="foot-note">今天也要元气满满 ✨</div>
      </div>
    </aside>

    <!-- 右侧主内容区 -->
    <main class="main">
      <div class="content">
        <header class="page-head">
          <h1>今日清单</h1>
          <p class="date" id="dateText"></p>
        </header>

        <!-- 励志语 -->
        <section class="card quote-card">
          <span class="quote-mark">“</span>
          <span class="quote-text" id="quoteText">慢慢来，比较快。</span>
          <span class="quote-mark">”</span>
          <button class="quote-btn" id="quoteBtn" title="换一句">↻</button>
        </section>

        <!-- 添加任务 -->
        <section class="card add-card">
          <div class="add-row">
            <input id="input" type="text" maxlength="80" placeholder="写下一件想做的事…" />
            <select id="catSelect">
              <option value="生活">生活</option>
              <option value="工作">工作</option>
              <option value="学习">学习</option>
              <option value="心情">心情</option>
              <option value="其他">其他</option>
            </select>
            <select id="priSelect" title="任务优先级">
              <option value="high">高</option>
              <option value="mid" selected>中</option>
              <option value="low">低</option>
            </select>
            <button class="add-btn" id="addBtn">＋ 记下</button>
          </div>
        </section>

        <!-- 任务列表 -->
        <section class="card list-card">
          <div class="list-head">
            <div class="filters">
              <button class="filter-btn active" data-filter="all">全部</button>
              <button class="filter-btn" data-filter="active">进行中</button>
              <button class="filter-btn" data-filter="done">已完成</button>
            </div>
            <span class="progress-label" id="progressLabel">0 / 0</span>
          </div>

          <div class="progress">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          </div>

          <ul id="list"></ul>

          <footer>
            <span id="doneStamp"></span>
            <button class="clear-btn" id="clearBtn">清空已完成</button>
          </footer>
        </section>
      </div>
    </main>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'techo-todos-v1';

  const $ = (id) => document.getElementById(id);
  const input = $('input');
  const catSelect = $('catSelect');
  const addBtn = $('addBtn');
  const list = $('list');
  const progressFill = $('progressFill');
  const progressLabel = $('progressLabel');
  const doneStamp = $('doneStamp');
  const clearBtn = $('clearBtn');
  const priSelect = $('priSelect');

  const CATS = ['生活', '工作', '学习', '心情', '其他'];
  const PRIORITY_ORDER = { high: 0, mid: 1, low: 2 };
  const PRIORITIES = [
    { key: 'high', label: '高', title: '优先：高' },
    { key: 'mid',  label: '中', title: '优先：中' },
    { key: 'low',  label: '低', title: '优先：低' }
  ];

  let todos = load();
  let filter = 'all';

  // 励志话语
  const quotes = [
    '慢慢来，比较快。',
    '把今天过好，就是对未来最好的准备。',
    '你只管努力，时间会给你答案。',
    '每天进步一点点，就是最好的坚持。',
    '生活明朗，万物可爱。',
    '别怕路远，就怕原地踏步。',
    '做好每一件小事，就是了不起的大事。',
    '眼里有光，心中有梦。',
    '今天也要元气满满呀！',
    '种一棵树最好的时间是十年前，其次是现在。',
    '路虽远，行则将至；事虽难，做则必成。',
    '你所热爱的，就是你的生活。',
    '心向阳光，一路生花。',
    '凡是过往，皆为序章。',
    '越努力，越幸运。',
    '慢慢走，也能走到想去的地方。',
    '不辜负每一个清晨，就是对日子最好的告白。',
    '先完成，再完美。',
    '心中有海，眼里有光，脚下有路。',
    '每一份坚持，都会在未来的某天开花结果。'
  ];

  const quoteText = $('quoteText');
  const quoteBtn = $('quoteBtn');

  function showQuote(index) {
    quoteText.textContent = quotes[index];
  }
  function randomQuote() {
    const daySeed = Math.floor(Date.now() / 86400000);
    return (daySeed + Math.floor(Math.random() * quotes.length)) % quotes.length;
  }
  showQuote(Math.floor(Date.now() / 86400000) % quotes.length);
  quoteBtn.addEventListener('click', () => showQuote(randomQuote()));

  // 日期
  const now = new Date();
  const week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
  $('dateText').textContent =
    now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · 星期' + week;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return arr.map((t) => ({
        ...t,
        priority: PRIORITY_ORDER[t.priority] != null ? t.priority : 'mid',
        createdAt: t.createdAt || 0
      }));
    } catch (e) {
      return [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  function addTodo() {
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    todos.unshift({
      id: Date.now() + Math.random().toString(36).slice(2),
      text: text,
      cat: catSelect.value,
      priority: priSelect.value,
      done: false,
      createdAt: Date.now()
    });
    input.value = '';
    input.focus();
    save();
    render();
  }

  function toggle(id) {
    const t = todos.find((x) => x.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function remove(id) {
    todos = todos.filter((x) => x.id !== id);
    save();
    render();
  }

  function clearDone() {
    todos = todos.filter((x) => !x.done);
    save();
    render();
  }

  function compare(a, b) {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const p = PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority];
    if (p !== 0) return p;
    return (b.createdAt || 0) - (a.createdAt || 0);
  }

  function cyclePriority(id) {
    const t = todos.find((x) => x.id === id);
    if (!t) return;
    const order = ['high', 'mid', 'low'];
    t.priority = order[(order.indexOf(t.priority) + 1) % order.length];
    save();
    render();
  }

  function buildItem(t) {
    const li = document.createElement('li');
    li.className = 'todo' + (t.done ? ' done' : '');

    const check = document.createElement('span');
    check.className = 'check';
    check.textContent = t.done ? '✓' : '';
    check.title = t.done ? '标记为未完成' : '标记为完成';
    check.addEventListener('click', () => toggle(t.id));

    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = t.text;

    const p = PRIORITIES.find((x) => x.key === t.priority) || PRIORITIES[1];
    const pri = document.createElement('span');
    pri.className = 'pri p-' + p.key;
    pri.textContent = p.label;
    pri.title = p.title + ' · 点击切换';
    pri.addEventListener('click', () => cyclePriority(t.id));

    const tag = document.createElement('span');
    tag.className = 'tag cat-' + t.cat;
    tag.textContent = t.cat;

    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除';
    del.addEventListener('click', () => remove(t.id));

    li.append(check, text, pri, tag, del);
    return li;
  }

  function render() {
    const visible = todos.filter((t) =>
      filter === 'all' ? true : filter === 'done' ? t.done : !t.done
    );

    list.innerHTML = '';

    if (visible.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      const msg = todos.length === 0
        ? '空空如也～ 写下第一件想做的事吧'
        : (filter === 'done' ? '还没有完成的事项 🌱' : '这里暂时没有事项 ✨');
      li.innerHTML = '<span class="doodle">🖍️</span>' + msg;
      list.appendChild(li);
    } else {
      const present = [...new Set(visible.map((t) => t.cat))];
      const cats = CATS.filter((c) => present.includes(c)).concat(
        present.filter((c) => !CATS.includes(c))
      );
      cats.forEach((cat) => {
        const items = visible.filter((t) => t.cat === cat).sort(compare);
        if (items.length === 0) return;

        const head = document.createElement('li');
        head.className = 'cat-group';
        const title = document.createElement('span');
        title.className = 'cat-group-title';
        title.textContent = cat;
        const count = document.createElement('span');
        count.className = 'cat-group-count';
        count.textContent = items.length;
        head.append(title, count);
        list.appendChild(head);

        items.forEach((t) => list.appendChild(buildItem(t)));
      });
    }

    updateProgress();
  }

  function updateProgress() {
    const total = todos.length;
    const done = todos.filter((t) => t.done).length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    progressFill.style.width = pct + '%';
    progressLabel.textContent = done + ' / ' + total;
    doneStamp.innerHTML = total && done === total
      ? '<span class="stamp-done">全部完成 🎉</span>'
      : (done > 0 ? '<span class="stamp-done">已完成 ' + done + ' 件</span>' : '');
  }

  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') addTodo(); });
  clearBtn.addEventListener('click', clearDone);

  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.filter;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
