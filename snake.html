<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇小游戏</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(circle at 50% 20%, #1e2a3a 0%, #0f141c 100%);
    color: #e8eef5;
    user-select: none;
  }

  .wrap { text-align: center; }

  h1 {
    font-size: 28px;
    letter-spacing: 6px;
    margin-bottom: 12px;
    color: #8be28b;
    text-shadow: 0 0 12px rgba(139, 226, 139, 0.4);
  }

  .panel {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 12px;
    font-size: 15px;
  }
  .panel span b { color: #8be28b; font-size: 18px; }

  #board {
    background: #0b1017;
    border: 2px solid #2a3648;
    border-radius: 6px;
    box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
    display: block;
    margin: 0 auto;
  }

  .hint {
    margin-top: 12px;
    color: #8896ab;
    font-size: 13px;
    line-height: 1.8;
  }
  .hint kbd {
    background: #1b2431;
    border: 1px solid #33415a;
    border-radius: 4px;
    padding: 2px 7px;
    font-family: inherit;
  }

  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  .overlay.show { display: flex; }

  .overlay .msg { font-size: 34px; letter-spacing: 4px; color: #ffb3b3; }
  .overlay .score { font-size: 16px; color: #cdd8e6; }

  button {
    font-size: 16px;
    letter-spacing: 2px;
    padding: 10px 26px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #8be28b;
    color: #0f141c;
    font-weight: 600;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(139, 226, 139, 0.35); }
</style>
</head>
<body>
  <div class="wrap">
    <h1>贪 吃 蛇</h1>
    <div class="panel">
      <span>分数 <b id="score">0</b></span>
      <span>最高分 <b id="best">0</b></span>
    </div>
    <div style="position: relative;">
      <canvas id="board" width="400" height="400"></canvas>
      <div class="overlay" id="overlay">
        <div class="msg" id="msg">游戏结束</div>
        <div class="score" id="final"></div>
        <button id="restart">重新开始</button>
      </div>
    </div>
    <p class="hint">
      方向键 / <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 控制移动<br>
      <kbd>空格</kbd> 暂停 / 继续
    </p>
  </div>

<script>
(function () {
  const CELL = 20;                 // 每格像素
  const COLS = 20;                 // 列数
  const ROWS = 20;                 // 行数
  const SPEED = 120;               // 每步毫秒

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const msgEl = document.getElementById('msg');
  const finalEl = document.getElementById('final');
  const restartBtn = document.getElementById('restart');

  let snake, dir, nextDir, food, score, best, timer, running, paused;

  best = parseInt(localStorage.getItem('snake_best') || '0', 10);
  bestEl.textContent = best;

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    running = true;
    paused = false;
    scoreEl.textContent = score;
    overlay.classList.remove('show');
    spawnFood();
  }

  function spawnFood() {
    do {
      food = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function step() {
    dir = nextDir;

    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // 撞墙
    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) return gameOver();

    // 撞到自己（注意尾巴会移动，吃到食物时不算撞）
    const willEat = head.x === food.x && head.y === food.y;
    const body = willEat ? snake : snake.slice(0, -1);
    if (body.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);
    if (willEat) {
      score += 10;
      scoreEl.textContent = score;
      spawnFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    if (score > best) {
      best = score;
      localStorage.setItem('snake_best', String(best));
      bestEl.textContent = best;
      msgEl.textContent = '新纪录！';
      msgEl.style.color = '#8be28b';
    } else {
      msgEl.textContent = '游戏结束';
      msgEl.style.color = '#ffb3b3';
    }
    finalEl.textContent = '本局得分：' + score;
    overlay.classList.add('show');
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 1; i < COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0);
      ctx.lineTo(i * CELL, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * CELL);
      ctx.lineTo(canvas.width, i * CELL);
      ctx.stroke();
    }

    // 食物
    ctx.fillStyle = '#ff6b6b';
    roundRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4, 5);
    ctx.fill();

    // 蛇
    snake.forEach((seg, i) => {
      const t = i / snake.length;
      ctx.fillStyle = i === 0
        ? '#8be28b'
        : `rgb(${Math.round(60 + 80 * t)}, ${Math.round(180 - 60 * t)}, ${Math.round(90 + 40 * t)})`;
      roundRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2, 4);
      ctx.fill();
    });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      clearInterval(timer);
      msgEl.textContent = '已暂停';
      msgEl.style.color = '#e8eef5';
      finalEl.textContent = '当前得分：' + score;
      overlay.classList.add('show');
    } else {
      overlay.classList.remove('show');
      timer = setInterval(step, SPEED);
    }
  }

  function start() {
    if (timer) clearInterval(timer);
    reset();
    draw();
    timer = setInterval(step, SPEED);
  }

  // 键盘控制
  document.addEventListener('keydown', function (e) {
    const k = e.key.toLowerCase();
    const map = {
      arrowup:    { x: 0, y: -1 },
      w:          { x: 0, y: -1 },
      arrowdown:  { x: 0, y: 1 },
      s:          { x: 0, y: 1 },
      arrowleft:  { x: -1, y: 0 },
      a:          { x: -1, y: 0 },
      arrowright: { x: 1, y: 0 },
      d:          { x: 1, y: 0 }
    };

    if (k === ' ') {
      e.preventDefault();
      togglePause();
      return;
    }

    const nd = map[k];
    if (!nd) return;
    e.preventDefault();

    // 禁止 180 度掉头
    if (nd.x === -dir.x && nd.y === -dir.y) return;
    nextDir = nd;
  });

  restartBtn.addEventListener('click', start);

  // 初始启动
  start();
})();
</script>
</body>
</html>
